[project]
name = "claude-library-mcp"
version = "0.5.1"
description = "Claude knowledge library MCP server"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.0.0,<2"]

[project.scripts]
claude-library-mcp = "server:main"
claude-library-kb = "kb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py", "kb/**"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4", "PyYAML>=6,<7"]
embed = ["fastembed>=0.7,<1"]
openai = ["openai>=1,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
