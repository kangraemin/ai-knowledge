# ai-bouncer 레포별 워크플로우 설정 — 기본값과 다른 것만 적는다.
# 기본값은 엔진(.claude/ai-bouncer/engine/default.yaml)이 갖고 업데이트 때마다 바뀐다.
# 병합 규칙: settings 는 키 단위 덮기 / stages.<이름>.steps 는 label 이 같으면 교체·새 label 이면 뒤에 추가 /
#            remove: [label…] 로 기본 step 삭제 / forbid 는 키 단위 덮기. 스키마: docs/SCHEMA.md

version: 1
settings:
  update_branch: "rework"
stages:
  verify:
    steps:
      - label: "검증 보고"
        inject: |
          [verify] 검증 단계다. 추측 금지 — 실제로 실행해서 확인한다.
            1. `bouncer run 'verify/설치 테스트'` 와 `bouncer run 'verify/파이썬 테스트'` 를 실행한다.
            2. 실패한 것을 통과로 보고하지 않는다.
      - label: "설치 테스트"
        run: "bats tests/install.bats"
        timeout: 900
        blocking: true
      - label: "파이썬 테스트"
        run: "cd mcp-server && uv run -q --extra postgres --with pytest pytest -q"
        timeout: 900
        blocking: true
