# ai-bouncer 레포 설정 — 기본값과 같은 형식. 모드·단계를 이름 단위로 교체하거나 추가한다.
#   stages.<단계>.prompt  할 일 / run  통과 조건(exit 0) / items  세부 항목
#   stages.<단계>.choosable  항목을 고르는 방식: ask 사용자에게 묻는다 / auto AI 가 고른다 / all 전부(기본)
# 형식: docs/SCHEMA.md

stages:
  verify:
    # 검사는 전부 고르는 항목이다 (verify 는 시작할 때 고른다). 단계 run 에 넣으면 매번 강제로 돈다.
    items:
      install:
        label: "설치 테스트 (bats)"
        run: ["bats tests/install.bats"]
      mcp:
        label: "MCP 서버 pytest"
        run: ["cd mcp-server && uv run -q --extra postgres --with pytest pytest -q"]
